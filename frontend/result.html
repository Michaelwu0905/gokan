<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分析结果</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: transparent;
    }

    #container {
      width: 100%;
      height: 100%;
      background: rgba(30, 30, 40, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    #header-title {
      color: #fff;
      font-size: 14px;
      font-weight: 500;
    }

    #close-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: background 0.2s;
    }

    #close-btn:hover {
      background: rgba(255, 100, 100, 0.8);
    }

    #content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #888;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result-section {
      margin-bottom: 16px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }

    .section-title {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .section-content {
      color: #fff;
      font-size: 14px;
      line-height: 1.6;
    }

    .original-text {
      font-size: 20px;
      font-weight: 500;
      color: #fff;
      margin-bottom: 4px;
    }

    .furigana {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 8px;
    }

    .translation {
      font-size: 14px;
      color: #ddd;
    }

    .grammar-item {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .grammar-item:last-child {
      border-bottom: none;
    }

    .grammar-word {
      font-weight: 500;
      color: #00d4ff;
      margin-bottom: 4px;
    }

    .grammar-explanation {
      font-size: 13px;
      color: #bbb;
    }

    .example-jp {
      font-size: 16px;
      color: #fff;
      margin-bottom: 4px;
    }

    .example-cn {
      font-size: 13px;
      color: #aaa;
    }

    #error {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      text-align: center;
    }

    #error-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    #error-message {
      color: #ff6b6b;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="header">
      <span id="header-title">日语分析结果</span>
      <button id="close-btn">×</button>
    </div>
    
    <div id="content">
      <div id="loading">
        <div class="spinner"></div>
        <span>正在分析...</span>
      </div>
      
      <div id="result" class="hidden">
        <div class="result-section">
          <div class="section-title">原文</div>
          <div class="original-text" id="original-text"></div>
          <div class="furigana" id="furigana"></div>
          <div class="translation" id="translation"></div>
        </div>
        
        <div class="result-section">
          <div class="section-title">语法解析</div>
          <div id="grammar-list"></div>
        </div>
        
        <div class="result-section">
          <div class="section-title">例句</div>
          <div class="example-jp" id="example-jp"></div>
          <div class="example-cn" id="example-cn"></div>
        </div>
      </div>
      
      <div id="error">
        <div id="error-icon">⚠️</div>
        <div id="error-message"></div>
        <button id="close-error-btn" class="close-btn">关闭</button>
      </div>
    </div>
  </div>

  <script src="result.js"></script>
</body>
</html>
