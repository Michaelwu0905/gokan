<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>截图选区</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      user-select: none;
      cursor: crosshair;
    }

    #capture-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #background-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
    }

    #selection {
      position: absolute;
      border: 2px solid #00d4ff;
      background: transparent;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
      display: none;
      pointer-events: none;
    }

    #selection::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: 1px dashed rgba(255, 255, 255, 0.8);
      pointer-events: none;
    }

    #info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      pointer-events: none;
      white-space: nowrap;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="capture-layer">
    <img id="background-image" src="" alt="屏幕截图">
    <div id="overlay"></div>
    <div id="selection"></div>
  </div>
  <div id="info">按住鼠标拖拽选择区域，按 ESC 取消</div>

  <script src="capture.js"></script>
</body>
</html>
